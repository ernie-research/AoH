[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomy-of-heads"
version = "0.1.0"
description = "Training-free attention-head classification from frozen query-key geometry"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "AoH Authors" }]
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "transformers>=4.40",
    "accelerate>=0.28",
    "tqdm>=4.66",
]

[project.optional-dependencies]
visualization = ["matplotlib>=3.7"]

[project.scripts]
aoh = "aoh.cli:main"

[tool.setuptools.packages.find]
include = ["aoh*"]
